[project]
name = "gamepadspeak-helper"
version = "0.1.0"
description = "Controller-triggered voice-to-chat helper for the WoW Forever GamepadSpeak addon"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pygame-ce>=2.5",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "faster-whisper>=1.1",
    "pynput>=1.8",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.scripts]
gamepadspeak-helper = "gamepadspeak_helper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["gamepadspeak_helper.py"]
