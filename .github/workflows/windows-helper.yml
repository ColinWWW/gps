name: Build Windows helper
on:
  workflow_dispatch:
  push:
    branches: [main, wow-hold-to-talk]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./helper pyinstaller lupa
      - run: python -m unittest discover -s tests -v
      - name: Package console helper
        working-directory: helper
        run: python -m PyInstaller --noconfirm --onedir --name WoWYap --collect-all faster_whisper --collect-all ctranslate2 --collect-all tokenizers --collect-all sounddevice --hidden-import pygame._sdl2.controller --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 gamepadspeak_helper.py
      - name: Assemble double-click package
        shell: pwsh
        run: |
          $out = "package/WoWYap"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse helper/dist/WoWYap/* $out/
          New-Item -ItemType Directory -Force -Path "$out/addon" | Out-Null
          Copy-Item -Recurse addon/WoWYap "$out/addon/WoWYap"
          Copy-Item Start.cmd, Check.cmd, Install.cmd, WoWYap.ini.example, README.md, CHANGELOG.md $out/
          Copy-Item -Recurse docs "$out/docs"
          # Frozen exe lives next to Start.cmd; app_root() finds addon/WoWYap.
          Get-ChildItem $out | Select-Object Name
      - uses: actions/upload-artifact@v4
        with:
          name: WoWYap-Windows
          path: package/WoWYap/
